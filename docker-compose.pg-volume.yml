# Opt in only for the planned production storage cutover or deployments after that cutover.
# Combine with image-only docker-compose.yml; preserve the selected release/project name.
# CONSOLE_PGDATA_HOST_PATH must be an existing PGDATA directory on the mounted DO Volume.
services:
  db:
    volumes:
      - type: bind
        source: ${CONSOLE_PGDATA_HOST_PATH:?Set CONSOLE_PGDATA_HOST_PATH to the existing Volume-backed PGDATA directory}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
